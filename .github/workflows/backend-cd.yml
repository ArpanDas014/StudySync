name: Backend CD (Deploy Database & Server)

on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - 'render.yaml'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview migrations without applying)'
        required: false
        default: false
        type: boolean

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy-database:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase Credentials
        id: check-creds
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice ::Supabase secrets not configured. Skipping automated CLI migration push."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Link Supabase Project
        if: steps.check-creds.outputs.configured == 'true'
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD" \
            --workdir Backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push Database Migrations (Live)
        if: steps.check-creds.outputs.configured == 'true' && !(inputs.dry_run == true)
        run: |
          supabase db push \
            --include-all \
            --yes \
            --password "$SUPABASE_DB_PASSWORD" \
            --workdir Backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Dry-Run Migrations Check
        if: steps.check-creds.outputs.configured == 'true' && inputs.dry_run == true
        run: |
          supabase db push \
            --dry-run \
            --include-all \
            --yes \
            --password "$SUPABASE_DB_PASSWORD" \
            --workdir Backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-server:
    name: Deploy Fastify Server
    runs-on: ubuntu-latest
    needs: [deploy-database]
    if: ${{ !(inputs.dry_run == true) }}
    steps:
      - name: Trigger Web Service Deploy Webhook
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render web service deployment..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "✅ Render deployment successfully triggered."
          elif [ -n "$RAILWAY_DEPLOY_HOOK" ]; then
            echo "Triggering Railway web service deployment..."
            curl -fsS -X POST "$RAILWAY_DEPLOY_HOOK"
            echo "✅ Railway deployment successfully triggered."
          else
            echo "ℹ️ No RENDER_DEPLOY_HOOK or RAILWAY_DEPLOY_HOOK secret set."
            echo "   (If you connected Render or Railway directly to this GitHub repo, auto-deploy triggers automatically upon push)."
          fi
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
